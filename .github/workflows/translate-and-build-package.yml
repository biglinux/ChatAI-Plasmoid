name: Translate and Build Package

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'With TMATE'
        required: false
        default: false

  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: If Template exit
        shell: bash
        run: |
          cancel () {
            echo "Pacote de template, não precisa traduzir e compilar"
            echo "SAINDO...."
            curl -s -H "Authorization: token ${{ github.token }}" \
            -X POST "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
            sleep infinity
          }
          if [ -n "$(grep biglinux-package-template pkgbuild/PKGBUILD)" ];then
            cancel
          fi
      
      - name: Install Translator Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install \
          git \
          gettext \
          npm
          # Install attranslator
          # v3 dropped the translation services (openai-translate.js patches v2)
          sudo npm install --location=global attranslate@2.3.1

      ## Tmate ##
      - name: Setup TMATE Session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Translate Package
        shell: bash #-O extglob {0}
        env:
          AZURE_KEY: ${{ secrets.AZURE_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          set -euo pipefail
          domain=ChatAI-Plasmoid
          languages="bg cs da de el es et fi fr he hr hu is it ja ko nl no pl pt ro ru sk sv tr uk zh"

          # attranslate backend used by every BigLinux package
          git clone --depth 1 https://github.com/biglinux/big-auto-translator.git ../big-auto-translator
          sudo cp -f ../big-auto-translator/openai-translate.js /usr/local/lib/node_modules/attranslate/dist/services/openai-translate.js

          # Extract with xgettext: the awk parser in gettext_po_generator_github.sh
          # cannot read this plasmoid's QML and produced an empty catalog, which
          # wiped en.po and the en/pt_BR .mo files.
          find contents -name '*.qml' -o -name '*.js' | sort | xargs xgettext \
            --from-code=UTF-8 -L JavaScript --package-name="$domain" \
            --msgid-bugs-address=https://github.com/ruscher/ChatAI-Plasmoid/issues \
            -ki18n:1 -ki18nc:1c,2 -ki18np:1,2 -ki18ncp:1c,2,3 \
            -o "locale/$domain.pot"
          if ! grep -q '^msgid ".' "locale/$domain.pot"; then
            echo "No translatable strings extracted, keeping the current catalogs" >&2
            exit 1
          fi

          # English is the source language
          msgen "locale/$domain.pot" | msginit --no-translator --no-wrap --locale=en -i - -o locale/en.po

          for lang in $languages; do
            attranslate --srcFile=locale/en.po --srcLng=en --srcFormat=po --targetFormat=po \
              --service=openai --serviceConfig="$OPENAI_KEY" \
              --targetFile="locale/$lang.po" --targetLng="$lang"
            sed -i '/^#, fuzzy$/d' "locale/$lang.po"
          done

          # pt_BR is reviewed by hand: only add the new strings to it
          msgmerge --update --no-fuzzy-matching --backup=none locale/pt_BR.po "locale/$domain.pot"

          sed -i '/"POT-Creation-Date:/d;/"PO-Revision-Date:/d' locale/*.po locale/*.pot

          # Plasma loads plasma_applet_<id>.mo from the package's contents/locale
          rm -rf contents/locale
          for po in locale/*.po; do
            lang=$(basename "$po" .po)
            mkdir -p "contents/locale/$lang/LC_MESSAGES"
            msgfmt "$po" -o "contents/locale/$lang/LC_MESSAGES/plasma_applet_$domain.mo"
          done

      - name: Update github
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --all
          if [ -n "$(git commit -m "translate $(date +%y-%m-%d_%H:%M)" -a | grep "nothing to commit")" ];then exit 0; fi

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Send Hooks BigLinux Build Package
        shell: bash
        run: |
          if [ -z "$(grep biglinux-package-template pkgbuild/PKGBUILD)" ];then
            curl -X POST -H "Accept: application/json" -H "Authorization: token ${{ secrets.WEBHOOK_TOKEN }}" --data '{"event_type": "${{ github.repository }}", "client_payload": { "branch": "${{ github.ref_name }}", "url": "https://github.com/${{ github.repository }}"}}' https://api.github.com/repos/BigLinux-Package-Build/build-package/dispatches
            curl -X POST -H "Accept: application/json" -H "Authorization: token ${{ secrets.WEBHOOK_TOKEN }}" --data '{"event_type": "${{ github.repository }}", "client_payload": { "branch": "${{ github.ref_name }}", "url": "https://github.com/${{ github.repository }}"}}' https://api.github.com/repos/BigLinux-Package-Build/build-package-ARM/dispatches
          fi
