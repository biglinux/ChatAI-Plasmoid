name: Validate Plasmoid

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-package:
    runs-on: ubuntu-latest
    # Arch ships the Plasma 6 QML modules qmllint has to resolve; Ubuntu does not
    container: archlinux:latest
    steps:
      - name: Install validation tools
        run: |
          # Runtime dependencies from pkgbuild/PKGBUILD plus the tools below
          pacman -Syu --noconfirm --needed git libxml2 zip unzip gettext python \
            qt6-declarative qt6-webengine libplasma plasma5support kirigami \
            kcmutils knotifications kiconthemes

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate metadata, QML, translations and package
        run: |
          set -e
          python3 -m json.tool metadata.json > /dev/null
          xmllint --noout contents/config/main.xml
          mapfile -t qml < <(find contents/ui contents/config -type f -name '*.qml')
          /usr/lib/qt6/bin/qmllint "${qml[@]}"
          for po in locale/*.po; do msgfmt --check --check-format -o /dev/null "$po"; done
          # Build the runtime package the same way the README documents and make
          # sure it carries only runtime files (no dev/VCS files).
          zip -qr /tmp/pkg.plasmoid metadata.json contents LICENSE
          if unzip -l /tmp/pkg.plasmoid | grep -E '(^|/)(docs|\.git|\.github)/'; then
            echo 'Package contains non-runtime files' >&2; exit 1
          fi
